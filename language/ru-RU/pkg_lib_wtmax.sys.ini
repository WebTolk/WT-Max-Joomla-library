PKG_LIB_WTMAX_MAYBE_INTERESTING="<h4>Может быть интересно</h4><ul class=\"nav nav-tabs nav-stacked list-group\"><li class=\"list-group-item\"><a href=\"https://web-tolk.ru/dev/web-assets\" target=\"_blank\" title=\"Перейти на https://web-tolk.ru\">Joomla 4 - Joomla 6 Web Assets</a></li><li class=\"list-group-item\"><a href=\"https://web-tolk.ru/dev/joomshopping\" target=\"_blank\" title=\"Перейти на https://web-tolk.ru\">Расширения для JoomShopping</a></li><li class=\"list-group-item\"><a href=\"https://web-tolk.ru/dev/joomla-plugins\" target=\"_blank\" title=\"Перейти на https://web-tolk.ru\">Плагины Joomla</a></li><li class=\"list-group-item\"><a href=\"https://web-tolk.ru/dev/joomla-modules\" target=\"_blank\" title=\"Перейти на https://web-tolk.ru\">Модули Joomla</a></li><li class=\"list-group-item\"><a href=\"https://web-tolk.ru/dev/components\" target=\"_blank\" title=\"Перейти на https://web-tolk.ru\">Компоненты Joomla</a></li><li class=\"list-group-item\"><a href=\"https://web-tolk.ru/dev/biblioteki\" target=\"_blank\" title=\"Перейти на https://web-tolk.ru\">Библиотеки Joomla для разработчиков</a></li></ul>"
PKG_LIB_WTMAX_WHATS_NEW="<h3>v.__DEPLOY_VERSION__ Что нового?</h3><ul><li>Подключена новая версия API-хоста: <code>https://platform-api2.max.ru</code>.</li><li>Расширена публичная API-поверхность: обновлены и дополнены методы для работы с чатами и сообщениями, включая сценарии по ссылкам на чат и выборке по <code>query_id</code> сообщения.</li><li>Обновлён набор публичных JSON-схем: добавлены и синхронизированы схемы для новых и изменённых endpoint-ов.</li><li>Обновлён и расширен справочный контент: README, стартовые руководства, референсы и описания сущностей и payload-ов приведены к текущему API-уровню.</li><li>Обновлена и проверена документация по ошибкам и интеграции, включая примеры использования.</li><li>Проведены проверки SDK на рабочем стенде: покрытие публичных методов, сравнение ответов и базовая валидация схем.</li></ul><p>Версия <strong>0.2.0</strong> фиксирует переход на актуальную платформу API и делает пакет согласованным с фактическим контрактом MAX API для стабильной разработки на PHP.</p><p><strong>Важно:</strong> Для корректной работы расширения на сервере должны быть установлены корневые сертификаты Минцифры Российской Федерации. <a href=\"https://web-tolk.ru/blog/ustanovka-sertifikatov-mintsifry-rossijskoj-federatsii-na-svoj-server\" target=\"_blank\">Инструкция по установке сертификатов Минцифры на сервер</a>.</p><p>Для начала работы включите <code>System - WT Max</code>, укажите токен бота MAX и проверьте статус подключения.</p><p><a href=\"index.php?option=com_plugins&view=plugins&filter[search]=WT Max\">Перейти к плагину интеграции.</a></p>"
