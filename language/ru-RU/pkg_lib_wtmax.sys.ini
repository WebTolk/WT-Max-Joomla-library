PKG_LIB_WTMAX_MAYBE_INTERESTING="<h4>Может быть интересно</h4><ul class=\"nav nav-tabs nav-stacked list-group\"><li class=\"list-group-item\"><a href=\"https://web-tolk.ru/dev/web-assets\" target=\"_blank\" title=\"Перейти на https://web-tolk.ru\">Joomla 4 - Joomla 6 Web Assets</a></li><li class=\"list-group-item\"><a href=\"https://web-tolk.ru/dev/joomshopping\" target=\"_blank\" title=\"Перейти на https://web-tolk.ru\">Расширения для JoomShopping</a></li><li class=\"list-group-item\"><a href=\"https://web-tolk.ru/dev/joomla-plugins\" target=\"_blank\" title=\"Перейти на https://web-tolk.ru\">Плагины Joomla</a></li><li class=\"list-group-item\"><a href=\"https://web-tolk.ru/dev/joomla-modules\" target=\"_blank\" title=\"Перейти на https://web-tolk.ru\">Модули Joomla</a></li><li class=\"list-group-item\"><a href=\"https://web-tolk.ru/dev/components\" target=\"_blank\" title=\"Перейти на https://web-tolk.ru\">Компоненты Joomla</a></li><li class=\"list-group-item\"><a href=\"https://web-tolk.ru/dev/biblioteki\" target=\"_blank\" title=\"Перейти на https://web-tolk.ru\">Библиотеки Joomla для разработчиков</a></li></ul>"
PKG_LIB_WTMAX_WHATS_NEW="<h3>v.__DEPLOY_VERSION__ Что нового?</h3><ul><li>В триггере события <code>onWtmaxSendMessage</code> теперь можно указать формат отправляемого сообщения.</li><li>Доступны три варианта: <code>plain</code>, <code>markdown</code> и <code>html</code>.</li><li>Если формат не указан, сообщение отправляется как обычный текст, как и в предыдущих версиях.</li><li>Это позволяет расширениям Joomla отправлять в MAX сообщения с Markdown- или HTML-форматированием без отдельной настройки системного плагина.</li><li>В подсказке системного плагина обновлён пример кода события.</li></ul><p>Для начала работы включите <code>System - WT Max</code>, укажите токен бота MAX и проверьте статус подключения.</p><p><a href=\"index.php?option=com_plugins&view=plugins&filter[search]=WT Max\">Перейти к плагину интеграции.</a></p>"
