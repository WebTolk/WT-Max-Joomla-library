PKG_LIB_WTMAX_MAYBE_INTERESTING="<h4>You may also find this interesting</h4><ul class=\"nav nav-tabs nav-stacked list-group\"><li class=\"list-group-item\"><a href=\"https://web-tolk.ru/dev/web-assets\" target=\"_blank\" title=\"Open https://web-tolk.ru\">Joomla 4 - Joomla 6 Web Assets</a></li><li class=\"list-group-item\"><a href=\"https://web-tolk.ru/dev/joomshopping\" target=\"_blank\" title=\"Open https://web-tolk.ru\">Extensions for JoomShopping</a></li><li class=\"list-group-item\"><a href=\"https://web-tolk.ru/dev/joomla-plugins\" target=\"_blank\" title=\"Open https://web-tolk.ru\">Joomla plugins</a></li><li class=\"list-group-item\"><a href=\"https://web-tolk.ru/dev/joomla-modules\" target=\"_blank\" title=\"Open https://web-tolk.ru\">Joomla modules</a></li><li class=\"list-group-item\"><a href=\"https://web-tolk.ru/dev/components\" target=\"_blank\" title=\"Open https://web-tolk.ru\">Joomla components</a></li><li class=\"list-group-item\"><a href=\"https://web-tolk.ru/dev/biblioteki\" target=\"_blank\" title=\"Open https://web-tolk.ru\">Joomla libraries for developers</a></li></ul>"
PKG_LIB_WTMAX_WHATS_NEW="<h3>v.__DEPLOY_VERSION__ What's new?</h3><ul><li>Incoming MAX webhooks through the protected <code>com_ajax</code> endpoint and the <code>onWtmaxIncomingWebhook</code> event for your plugins.</li><li>Outbound messages from third-party extensions through <code>onWtmaxSendMessage</code>: text, files, and link buttons.</li><li>MAX chat selection in the administrator UI through Joomla 5+ <code>ModalSelect</code> and default <code>chat_id</code> configuration.</li><li>Webhook subscription management, secret generation, callback URL, and subscription list directly in the plugin settings.</li></ul><p>To start, enable <code>System - WT Max</code>, enter the MAX bot token, and check the connection status.</p><p><a href=\"index.php?option=com_plugins&view=plugins&filter[search]=WT Max\">Go to the integration plugin.</a></p>"
