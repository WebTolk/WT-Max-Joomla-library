PKG_LIB_WTMAX_MAYBE_INTERESTING="<h4>You may also find this interesting</h4><ul class=\"nav nav-tabs nav-stacked list-group\"><li class=\"list-group-item\"><a href=\"https://web-tolk.ru/dev/web-assets\" target=\"_blank\" title=\"Open https://web-tolk.ru\">Joomla 4 - Joomla 6 Web Assets</a></li><li class=\"list-group-item\"><a href=\"https://web-tolk.ru/dev/joomshopping\" target=\"_blank\" title=\"Open https://web-tolk.ru\">Extensions for JoomShopping</a></li><li class=\"list-group-item\"><a href=\"https://web-tolk.ru/dev/joomla-plugins\" target=\"_blank\" title=\"Open https://web-tolk.ru\">Joomla plugins</a></li><li class=\"list-group-item\"><a href=\"https://web-tolk.ru/dev/joomla-modules\" target=\"_blank\" title=\"Open https://web-tolk.ru\">Joomla modules</a></li><li class=\"list-group-item\"><a href=\"https://web-tolk.ru/dev/components\" target=\"_blank\" title=\"Open https://web-tolk.ru\">Joomla components</a></li><li class=\"list-group-item\"><a href=\"https://web-tolk.ru/dev/biblioteki\" target=\"_blank\" title=\"Open https://web-tolk.ru\">Joomla libraries for developers</a></li></ul>"
PKG_LIB_WTMAX_WHATS_NEW="<h3>v.__DEPLOY_VERSION__ What's new?</h3><ul><li>Connected the new API host version: <code>https://platform-api2.max.ru</code>.</li><li>Expanded the public API surface: chat and message methods were updated and extended, including chat-link scenarios and message lookup by <code>query_id</code>.</li><li>Updated the public JSON schema set: schemas for new and changed endpoints were added and synchronized.</li><li>Updated and expanded the reference content: README, quick-start guides, references, and entity and payload descriptions are aligned with the current API level.</li><li>Updated and verified the error-handling and integration documentation, including usage examples.</li><li>Ran SDK checks on the working stand: public method coverage, response comparison, and basic schema validation.</li></ul><p>Version <strong>0.2.0</strong> completes the move to the current API platform and keeps the package aligned with the actual MAX API contract for stable PHP development.</p><p><strong>Important:</strong> For correct extension operation, the server must have the root certificates of the Ministry of Digital Development of the Russian Federation installed. <a href=\"https://web-tolk.ru/blog/ustanovka-sertifikatov-mintsifry-rossijskoj-federatsii-na-svoj-server\" target=\"_blank\">Certificate installation guide</a>.</p><p>To start, enable <code>System - WT Max</code>, enter the MAX bot token, and check the connection status.</p><p><a href=\"index.php?option=com_plugins&view=plugins&filter[search]=WT Max\">Go to the integration plugin.</a></p>"
