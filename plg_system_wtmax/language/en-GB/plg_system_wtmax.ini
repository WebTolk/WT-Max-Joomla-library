PLG_WTMAX_LOG_SEPARATE_FILE_DESC="Write SDK request and response logs into a dedicated Joomla log file."
PLG_WTMAX_LOG_FILE="Log file name"
PLG_WTMAX_LOG_FILE_DESC="Optional file name in the Joomla log directory. Specify the file name only, without a path. If empty, the default file wtmax.log is used."
PLG_WTMAX_DEFAULT_CHAT_ID="Default MAX chat_id"
PLG_WTMAX_DEFAULT_CHAT_ID_DESC="MAX chat used for outbound messages when the event does not pass params['chat_id']."
PLG_WTMAX_OUTBOUND_CODE_EXAMPLE_LABEL="Send code example"
PLG_WTMAX_OUTBOUND_CODE_EXAMPLE="<code><pre>$event = \Joomla\CMS\Event\AbstractEvent::create('onWtmaxSendMessage', [\n    'subject' => $this,\n    'message' => '**New Joomla message**',\n    'attachments' => [\n        ['type' => 'image', 'path' => '/images/example.jpg'],\n        ['type' => 'link', 'url' => 'https://example.com', 'text' => 'Open'],\n    ],\n    'params' => [\n        'context' => 'com_content.article',\n        'item_id' => 10,\n        'chat_id' => 123456,\n        'text_format' => 'markdown', // plain, markdown, or html\n        'notify' => true,\n        'disable_link_preview' => false,\n    ],\n]);\n\n$this->getApplication()->getDispatcher()->dispatch($event->getName(), $event);\n\nreturn $event->getArgument('result', []);</pre></code>"
PLG_WTMAX_OUTBOUND_CODE_DESC_LABEL="How outbound delivery works"
PLG_WTMAX_OUTBOUND_CODE_DESC="<ul><li><code>message</code> - outgoing message text.</li><li><code>params['text_format']</code> - message format: <code>plain</code>, <code>markdown</code>, or <code>html</code>. If omitted, <code>plain</code> is used.</li><li><code>attachments</code> - attachment list. For files, use <code>type</code> with <code>image</code>, <code>video</code>, <code>audio</code>, or <code>file</code> and a local site path in <code>path</code>. If <code>type</code> is omitted, the plugin detects it from the file MIME type.</li><li><code>type = link</code> creates a MAX inline button and requires <code>url</code>; <code>text</code> is optional.</li><li><code>params['chat_id']</code> overrides the default chat for one message.</li><li><code>params['context']</code> and <code>params['item_id']</code> are stored in the sent-message audit table.</li><li><code>params['notify']</code> and <code>params['disable_link_preview']</code> are passed to MAX for this message.</li></ul>"
