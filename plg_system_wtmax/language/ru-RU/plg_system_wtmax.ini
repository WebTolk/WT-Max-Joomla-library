PLG_WTMAX_LOG_SEPARATE_FILE_DESC="Записывать логи запросов и ответов SDK в отдельный лог-файл Joomla."
PLG_WTMAX_LOG_FILE="Имя лог-файла"
PLG_WTMAX_LOG_FILE_DESC="Необязательное имя файла в каталоге логов Joomla. Указывается только имя файла без пути. Если поле пустое, используется файл wtmax.log по умолчанию."
PLG_WTMAX_DEFAULT_CHAT_ID="MAX chat_id по умолчанию"
PLG_WTMAX_DEFAULT_CHAT_ID_DESC="Чат MAX, куда будут отправляться исходящие сообщения, если событие не передало params['chat_id']."
PLG_WTMAX_OUTBOUND_CODE_EXAMPLE_LABEL="Пример кода отправки"
PLG_WTMAX_OUTBOUND_CODE_EXAMPLE="<code><pre>$event = \Joomla\CMS\Event\AbstractEvent::create('onWtmaxSendMessage', [\n    'subject' => $this,\n    'message' => '**Новое сообщение из Joomla**',\n    'attachments' => [\n        ['type' => 'image', 'path' => '/images/example.jpg'],\n        ['type' => 'link', 'url' => 'https://example.com', 'text' => 'Открыть'],\n    ],\n    'params' => [\n        'context' => 'com_content.article',\n        'item_id' => 10,\n        'chat_id' => 123456,\n        'text_format' => 'markdown', // plain, markdown или html\n        'notify' => true,\n        'disable_link_preview' => false,\n    ],\n]);\n\n$this->getApplication()->getDispatcher()->dispatch($event->getName(), $event);\n\nreturn $event->getArgument('result', []);</pre></code>"
PLG_WTMAX_OUTBOUND_CODE_DESC_LABEL="Как работает исходящая отправка"
PLG_WTMAX_OUTBOUND_CODE_DESC="<ul><li><code>message</code> - текст отправляемого сообщения.</li><li><code>params['text_format']</code> - формат сообщения: <code>plain</code>, <code>markdown</code> или <code>html</code>. Если параметр не указан, используется <code>plain</code>.</li><li><code>attachments</code> - массив вложений. Для файлов используйте <code>type</code> со значением <code>image</code>, <code>video</code>, <code>audio</code> или <code>file</code> и локальный путь <code>path</code> внутри сайта. Если <code>type</code> не указан, плагин определит его по MIME-типу файла.</li><li><code>type = link</code> создаёт inline-кнопку MAX и требует <code>url</code>; <code>text</code> необязателен.</li><li><code>params['chat_id']</code> переопределяет чат по умолчанию для конкретного сообщения.</li><li><code>params['context']</code> и <code>params['item_id']</code> сохраняются в журнал отправленных сообщений.</li><li><code>params['notify']</code> и <code>params['disable_link_preview']</code> передаются в MAX для конкретного сообщения.</li></ul>"
